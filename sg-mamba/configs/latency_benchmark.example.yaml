# Supply real model/predictor instances through the listed factory kwargs.
# Construction, checkpoint loading, and warm-up occur outside per-video timing.
mode: benchmark
weights_mode: required
stages:
  - name: decode
    factory: experiments.latency.adapters.video:VideoDecodeAdapter
    kwargs: {}
  - name: coarse_detector
    factory: experiments.latency.adapters.detectors:CoarseDetectorAdapter
    kwargs: {}
  - name: flow_extract
    factory: experiments.latency.adapters.flow:FlowExtractAdapter
    kwargs:
      width: 128
      height: 128
  - name: i3d_extract
    factory: experiments.latency.adapters.i3d:make_i3d_adapter
    kwargs:
      rgb_checkpoint: pretrained/pretrained_swallow_i3d.pth
      flow_checkpoint: pretrained/flow_imagenet.pt
      weights_mode: required
  - name: keypoint_extract
    factory: experiments.latency.adapters.keypoints:KeypointExtractAdapter
    kwargs: {}
  - name: kalman_smooth
    factory: experiments.latency.adapters.keypoints:KalmanSmoothAdapter
    kwargs: {}
  - name: skeleton_encode
    factory: experiments.latency.adapters.keypoints:SkeletonEncodeAdapter
    kwargs: {}
  - name: fine_detector
    factory: experiments.latency.adapters.detectors:FineDetectorAdapter
    kwargs: {}
  - name: postprocess
    factory: experiments.latency.adapters.detectors:PostprocessAdapter
    kwargs:
      segment_duration: 4.004
